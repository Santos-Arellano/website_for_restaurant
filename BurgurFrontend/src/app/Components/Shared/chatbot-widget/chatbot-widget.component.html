<div class="chatbot">
  <!-- Floating Button -->
  <button class="chat-toggle" (click)="toggle()" aria-label="Abrir chat">
    <i class="fas" [class.fa-comments]="!isOpen" [class.fa-xmark]="isOpen"></i>
  </button>

  <!-- Chat Panel -->
  <div class="chat-panel" [class.open]="isOpen">
    <div class="chat-header">
      <div class="chat-title">
        <img src="assets/images/Logo.png" alt="BurGur" class="chat-logo">
        <div>
          <h4>BurGur Assistant</h4>
          <span>Online</span>
        </div>
      </div>
      <button class="close-btn" (click)="toggle()" aria-label="Cerrar">
        <i class="fas fa-chevron-down"></i>
      </button>
    </div>

    <div class="chat-body">
      <div class="welcome-hint" *ngIf="messages.length <= 2">
        <span>Elige una opción rápida o escribe tu pregunta</span>
      </div>
      <div class="suggestions">
        <button class="suggestion" *ngFor="let s of quickSuggestions" (click)="useSuggestion(s.action)">
          {{ s.label }}
        </button>
      </div>

      <div class="messages">
        <div *ngFor="let msg of messages" class="msg" [class.bot]="msg.from === 'bot'" [class.user]="msg.from === 'user'">
          <div class="bubble">
            <span>{{ msg.text }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-input">
      <input type="text" placeholder="Escribe tu mensaje…" [(ngModel)]="inputText" (keydown)="onEnter($event)" />
      <button class="send-btn" [disabled]="isSending || !inputText.trim()" (click)="sendMessage()">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>
