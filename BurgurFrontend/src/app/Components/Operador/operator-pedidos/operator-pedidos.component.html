<section class="operator-pedidos-section">
  <div class="header">
    <h1>Pedidos Activos</h1>
    <button class="btn-logout" (click)="logout()">Cerrar sesión</button>
  </div>

  <div class="filters">
    <label>Filtrar por estado:</label>
    <select [(ngModel)]="filtroEstado">
      <option value="todos">Todos</option>
      <option *ngFor="let e of estados" [value]="e">{{ e }}</option>
    </select>
    <button class="btn-refresh" (click)="cargarPedidos()" [disabled]="loading">{{ loading ? 'Cargando...' : 'Refrescar' }}</button>
  </div>

  <div class="lista-pedidos" *ngIf="pedidosFiltrados().length; else empty">
    <div class="pedido-card" *ngFor="let p of pedidosFiltrados()">
      <div class="card-loading" *ngIf="accionEnProgreso[p.id]"><span class="spinner"></span> Procesando...</div>
      <div class="pedido-info">
        <div>
          <div class="pedido-id">Pedido #{{ p.id }}</div>
          <div class="pedido-cliente">Cliente: {{ clienteNombre(p.clienteId) }}</div>
          <div class="pedido-direccion">Entrega: {{ p.direccionEntrega }}</div>
          <div class="pedido-domiciliario" *ngIf="p.domiciliarioId">Domiciliario: {{ domNombre(p.domiciliarioId) }}</div>
        </div>
        <div class="pedido-estado">Estado: <strong>{{ p.estado }}</strong></div>
      </div>

      <div class="acciones">
        <button class="btn-recibido" (click)="cambiarEstado(p, EstadoPedido.PENDIENTE)" [disabled]="accionEnProgreso[p.id] || p.estado === EstadoPedido.ENTREGADO">Recibido</button>
        <button class="btn-cocinando" (click)="cambiarEstado(p, EstadoPedido.EN_PREPARACION)" [disabled]="accionEnProgreso[p.id] || p.estado === EstadoPedido.ENTREGADO">Cocinando</button>
        <button class="btn-enviado" *ngIf="p.estado !== EstadoPedido.EN_CAMINO" (click)="cambiarEstado(p, EstadoPedido.EN_CAMINO)" [disabled]="accionEnProgreso[p.id] || p.estado === EstadoPedido.ENTREGADO || (!domSeleccionado[p.id] && !p.domiciliarioId)">Enviado</button>
        <button class="btn-entregado" (click)="cambiarEstado(p, EstadoPedido.ENTREGADO)" [disabled]="accionEnProgreso[p.id] || p.estado === EstadoPedido.ENTREGADO">Entregado</button>
      </div>

      <div class="asignar-domi" *ngIf="p.estado === EstadoPedido.PENDIENTE || p.estado === EstadoPedido.EN_PREPARACION">
        <label>Domiciliario:</label>
        <select [(ngModel)]="domSeleccionado[p.id]" [disabled]="accionEnProgreso[p.id]">
          <option [ngValue]="undefined">Selecciona</option>
          <option *ngFor="let d of domDisponibles" [ngValue]="d.id">{{ d.nombre }} (ID {{ d.id }})</option>
        </select>
      </div>
    </div>
  </div>

  <ng-template #empty>
    <div class="empty">No hay pedidos activos</div>
  </ng-template>
</section>
