<div class="loading-overlay" role="status" aria-live="polite" aria-busy="true">
  <div class="scene">
    <div class="blob blob1" aria-hidden="true"></div>
    <div class="blob blob2" aria-hidden="true"></div>

    <div class="spinner" aria-hidden="true">
      <div class="spinner-ring"></div>
      <div class="spinner-hole"></div>
      <div class="icon">
        <i class="fa-solid fa-burger burger-icon" aria-hidden="true"></i>
      </div>
    </div>

    <div class="label">
      <span class="text">cargando sabores</span><span class="dots">{{ dots }}</span>
    </div>

    <div class="progress" aria-hidden="true">
      <div class="bar"></div>
    </div>
  </div>
</div>
