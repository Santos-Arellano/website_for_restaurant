<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" aria-label="Mapa alternativo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dfe6ee" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Elementos neutrales sin ruta dibujada para evitar duplicación visual -->
  <g opacity="0.12">
    <rect x="120" y="100" width="200" height="140" fill="#95a5a6" rx="6"/>
    <rect x="420" y="320" width="240" height="160" fill="#bdc3c7" rx="6"/>
    <circle cx="300" cy="260" r="60" fill="#cfd8dc"/>
  </g>

  <g opacity="0.8">
    <text x="20" y="580" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      Vista de mapa alternativa (tiles deshabilitados)
    </text>
  </g>
</svg>